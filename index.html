<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Blockfall</title>
<style>
  :root {
    --bg: #07051a;
    --panel: rgba(18, 13, 46, 0.78);
    --edge: rgba(90, 225, 255, 0.45);
    --cyan: #2cf6ff;
    --pink: #ff3fd8;
    --text: #eef0ff;
    --muted: #8e8ac8;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    touch-action: none;
  }
  #app {
    position: relative;
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    padding-left: 2px;
    padding-right: 2px;
    background:
      radial-gradient(ellipse 90% 55% at 50% 0%, rgba(120, 40, 220, 0.45) 0%, transparent 70%),
      radial-gradient(ellipse 80% 40% at 50% 100%, rgba(255, 50, 200, 0.22) 0%, transparent 70%),
      linear-gradient(180deg, #0d0828 0%, #07051a 55%, #0a0420 100%);
    overflow: hidden;
  }
  /* Neon horizon grid at the bottom */
  #app::before {
    content: "";
    position: absolute;
    left: -50%;
    right: -50%;
    bottom: 0;
    height: 38%;
    background:
      repeating-linear-gradient(90deg, rgba(255, 63, 216, 0.22) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(0deg, rgba(255, 63, 216, 0.22) 0 1px, transparent 1px 34px);
    transform: perspective(260px) rotateX(58deg);
    transform-origin: bottom center;
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
            mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
    pointer-events: none;
  }

  /* Top stats */
  #top-bar {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr 1.6fr;
    gap: 6px;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    flex-shrink: 0;
  }
  .stat {
    background: var(--panel);
    border: 1.5px solid var(--edge);
    border-radius: 12px;
    padding: 5px 6px 6px;
    text-align: center;
    box-shadow: 0 0 12px rgba(44, 246, 255, 0.15), inset 0 0 14px rgba(44, 246, 255, 0.06);
  }
  .stat.score {
    border-color: rgba(255, 63, 216, 0.7);
    box-shadow: 0 0 16px rgba(255, 63, 216, 0.3), inset 0 0 16px rgba(255, 63, 216, 0.08);
  }
  .stat-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #8fe9ff;
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .stat.score .stat-label { color: #ff9cf0; justify-content: space-between; padding: 0 4px; }
  .best { color: var(--muted); letter-spacing: 1px; }
  .stat-val {
    font-size: 22px;
    font-weight: 900;
    margin-top: 1px;
    text-shadow: 0 0 10px rgba(44, 246, 255, 0.6);
    font-variant-numeric: tabular-nums;
    transition: transform 0.12s;
  }
  .stat.score .stat-val { text-shadow: 0 0 12px rgba(255, 63, 216, 0.75); }
  .stat-val.bump { transform: scale(1.18); }

  /* Arena */
  #arena {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    max-width: 500px;
    margin: 8px auto 0;
    display: flex;
    gap: 3px;
    align-items: stretch;
  }
  .wing {
    width: 32px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #btn-pause {
    width: 100%;
    height: 40px;
    border-radius: 10px;
    background: var(--panel);
    border: 1.5px solid var(--edge);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(44, 246, 255, 0.15);
  }
  #btn-pause .bar {
    width: 5px;
    height: 16px;
    border-radius: 2px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  #btn-pause:active { background: rgba(44, 246, 255, 0.25); }
  .box {
    background: var(--panel);
    border: 1.5px solid var(--edge);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(44, 246, 255, 0.12);
  }
  .box-title {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-align: center;
    padding: 5px 0 3px;
    color: #8fe9ff;
  }
  #hold-box { cursor: pointer; }
  #hold-box.locked canvas { opacity: 0.35; }
  .box canvas { display: block; margin: 0 auto 6px; }
  #next-box { margin-top: 48px; }

  #board-wrap {
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  #board-frame {
    position: relative;
    padding: 3px;
    border-radius: 10px;
    background: linear-gradient(160deg, rgba(44, 246, 255, 0.85), rgba(140, 70, 255, 0.6) 50%, rgba(255, 63, 216, 0.85));
    box-shadow: 0 0 22px rgba(120, 90, 255, 0.45), 0 0 50px rgba(255, 63, 216, 0.18);
    will-change: transform;
  }
  #board {
    display: block;
    border-radius: 7px;
    background: linear-gradient(180deg, rgba(14, 10, 40, 0.96), rgba(8, 6, 26, 0.97));
  }

  /* Title / game over overlay */
  #overlay {
    position: absolute;
    inset: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    border-radius: 7px;
    background: rgba(6, 4, 20, 0.55);
    transition: opacity 0.35s;
  }
  #overlay.hidden { opacity: 0; }
  .ov-card { text-align: center; padding: 0 10px; }
  .ov-title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--cyan), #b46bff, var(--pink));
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(180, 100, 255, 0.7));
  }
  .ov-sub {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: var(--text);
    animation: blink 1.4s ease-in-out infinite;
  }
  .ov-score {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 800;
    color: #ff9cf0;
  }
  @keyframes blink { 50% { opacity: 0.35; } }

  #swipe-space { flex-shrink: 0; height: clamp(40px, 7dvh, 80px); }

  /* Pause menu */
  #menu {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(5, 3, 16, 0.78);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  #menu.hidden { display: none; }
  .menu-card {
    width: 100%;
    max-width: 320px;
    background: rgba(18, 12, 48, 0.95);
    border: 1.5px solid rgba(255, 63, 216, 0.7);
    border-radius: 18px;
    padding: 18px 14px 14px;
    box-shadow: 0 0 30px rgba(255, 63, 216, 0.3), 0 0 60px rgba(44, 246, 255, 0.12);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .menu-title {
    text-align: center;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--text);
    text-shadow: 0 0 12px rgba(255, 63, 216, 0.8);
    margin-bottom: 2px;
  }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt-btn {
    background: rgba(30, 22, 70, 0.9);
    color: var(--text);
    border: 1.5px solid var(--edge);
    border-radius: 12px;
    padding: 12px 4px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .opt-btn.main {
    border: none;
    padding: 15px 4px;
    font-size: 16px;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #13b8e0, #8d4dff, #e030c0);
    box-shadow: 0 0 18px rgba(160, 80, 255, 0.55);
  }
  .opt-btn:active { filter: brightness(1.4); }
  .opt-btn.off { color: var(--muted); border-color: rgba(142, 138, 200, 0.3); }
  .opt-btn.wide { grid-column: span 2; }
  .vol-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(30, 22, 70, 0.9);
    border: 1.5px solid var(--edge);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .vol-label, .vol-val {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .vol-label { width: 52px; }
  .vol-val { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  .vol-row input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 4px;
    outline: none;
    touch-action: none;
    background: linear-gradient(90deg, var(--cyan), var(--pink)) 0 0 / var(--fill, 70%) 100% no-repeat, rgba(142, 138, 200, 0.25);
  }
  .vol-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--pink);
    box-shadow: 0 0 10px var(--pink);
  }
  .vol-row input[type=range]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--pink);
    box-shadow: 0 0 10px var(--pink);
  }
  .menu-card { max-height: calc(100dvh - 32px); overflow-y: auto; }
  .track-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    text-align: left;
  }
  .track-btn #track-name { flex: 1; text-align: right; color: var(--cyan); text-shadow: 0 0 8px rgba(44, 246, 255, 0.6); }
  .track-btn .caret { transition: transform 0.15s; }
  .track-btn.open .caret { transform: rotate(180deg); }
  #track-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: -4px;
  }
  #track-list.hidden { display: none; }
  .track-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(12, 8, 34, 0.95);
    color: var(--text);
    border: 1.5px solid rgba(142, 138, 200, 0.3);
    border-radius: 12px;
    padding: 10px 12px;
    font-family: var(--font);
    cursor: pointer;
    text-align: left;
  }
  .track-opt .t-name { font-size: 13px; font-weight: 800; letter-spacing: 1px; }
  .track-opt .t-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .track-opt .t-dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--muted);
    flex-shrink: 0;
  }
  .track-opt.sel { border-color: var(--pink); box-shadow: 0 0 12px rgba(255, 63, 216, 0.35); }
  .track-opt.sel .t-dot { border-color: var(--pink); background: var(--pink); box-shadow: 0 0 8px var(--pink); }
  #hint {
    font-size: 10.5px;
    line-height: 1.7;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid rgba(142, 138, 200, 0.25);
    padding-top: 8px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="top-bar">
    <div class="stat">
      <div class="stat-label">LINES</div>
      <div class="stat-val" id="lines">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">LEVEL</div>
      <div class="stat-val" id="level">1</div>
    </div>
    <div class="stat score">
      <div class="stat-label"><span>SCORE</span><span class="best">BEST <span id="best">0</span></span></div>
      <div class="stat-val" id="score">0</div>
    </div>
  </div>

  <div id="arena">
    <div class="wing">
      <button id="btn-pause" aria-label="Pause menu"><span class="bar"></span><span class="bar"></span></button>
      <div class="box" id="hold-box">
        <div class="box-title">HOLD</div>
        <canvas id="hold-cv"></canvas>
      </div>
    </div>

    <div id="board-wrap">
      <div id="board-frame">
        <canvas id="board"></canvas>
        <div id="overlay">
          <div class="ov-card">
            <div class="ov-title" id="ov-title">BLOCKFALL</div>
            <div class="ov-score" id="ov-score"></div>
            <div class="ov-sub" id="ov-sub">TAP TO START</div>
          </div>
        </div>
      </div>
    </div>

    <div class="wing">
      <div class="box" id="next-box">
        <div class="box-title">NEXT</div>
        <canvas id="next-cv"></canvas>
      </div>
    </div>
  </div>

  <div id="swipe-space"></div>
</div>

<div id="menu" class="hidden">
  <div class="menu-card">
    <div class="menu-title" id="menu-title">PAUSED</div>
    <button class="opt-btn main" id="btn-start">RESUME</button>
    <div class="menu-grid">
      <button class="opt-btn" id="btn-hold">HOLD: ON</button>
      <button class="opt-btn" id="btn-next">NEXT: ON</button>
      <button class="opt-btn" id="btn-ghost">GHOST: ON</button>
      <button class="opt-btn" id="btn-vibe">VIBRATE: ON</button>
    </div>
    <div class="vol-row">
      <span class="vol-label">SFX</span>
      <input type="range" id="sfx-vol" min="0" max="100" step="5" value="80" aria-label="Sound effects volume">
      <span class="vol-val" id="sfx-vol-val">80%</span>
    </div>
    <div class="vol-row">
      <span class="vol-label">MUSIC</span>
      <input type="range" id="music-vol" min="0" max="100" step="5" value="70" aria-label="Music volume">
      <span class="vol-val" id="music-vol-val">70%</span>
    </div>
    <button class="opt-btn track-btn" id="btn-track"><span>TRACK</span><span id="track-name">NEON DRIVE</span><span class="caret" id="track-caret">&#9662;</span></button>
    <div id="track-list" class="hidden"></div>
    <button class="opt-btn" id="btn-reset">RESTART</button>
    <div id="hint">Swipe L/R: Move &bull; Tap: Rotate<br>Drag down: Soft drop &bull; Flick down: Hard drop<br>Tap HOLD box: Hold piece<br>Combos, T-spins &amp; back-to-back give bonus points</div>
  </div>
</div>

<script>
// ===================== Rules & state =====================
const W = 10, H = 20;
const SHAPES = [
  // I
  [[[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]]],
  // O
  [[[1,0],[2,0],[1,1],[2,1]]],
  // T
  [[[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]]],
  // S
  [[[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]]],
  // Z
  [[[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]]],
  // J
  [[[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]]],
  // L
  [[[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]]]
];
// Neon colours per piece: I O T S Z J L
const COLORS = ["#2cf6ff", "#ffe53b", "#c04bff", "#3dff7a", "#ff3b5c", "#3d7bff", "#ff9a2e"];
const GRAY = "#4a4670";

const KICKS = [[0,0], [-1,0], [1,0], [0,-1], [-1,-1], [1,-1], [-2,0], [2,0], [0,-2]];
const LOCK_DELAY = 500;
const MAX_LOCK_RESETS = 15;
const CLEAR_MS = 360;

let board = [];               // 0 = empty, 1..7 = piece colour index + 1
let curType = 0, rot = 0, px = 3, py = 0, pieceId = 0;
let bag = [], nextQueue = [];
let holdType = null, holdUsed = false;
let score = 0, lines = 0, level = 1, bestScore = 0;
let state = "TITLE";          // TITLE | PLAY | PAUSE | OVER
let allowHold = true, showNext = true, showGhost = true, sfxOn = true, sfxVol = 80, musicVol = 70, musicTrack = 0, vibeOn = true;
let lastFall = 0;
let lockStart = null, lockResets = 0, lowestY = 0;
let clearing = null;          // { rows, t0 } while a line-clear animation plays
let pausedAt = 0;
let gameOverT0 = 0;
let menuOpen = false;
let combo = -1, b2b = false;  // combo counter / back-to-back flag
let lastMoveRotate = false;   // for T-spin detection

try {
  bestScore = parseInt(localStorage.getItem("blockfall_best") || "0", 10) || 0;
  const o = JSON.parse(localStorage.getItem("blockfall_opts") || "null");
  if (o) ({ allowHold, showNext, showGhost, sfxVol, musicVol, musicTrack, vibeOn } = Object.assign({ allowHold, showNext, showGhost, sfxVol, musicVol, musicTrack, vibeOn }, o));
  if (o && o.sfxOn === false && o.sfxVol === undefined) sfxVol = 0;
  sfxVol = Math.max(0, Math.min(100, Number(sfxVol) || 0));
  sfxOn = sfxVol > 0;
  musicTrack = [0, 1, 2].includes(musicTrack) ? musicTrack : 0;
  if (o && o.musicOn === false && o.musicVol === undefined) musicVol = 0;
  musicVol = Math.max(0, Math.min(100, Number(musicVol) || 0));
} catch (e) {}
function saveOpts() {
  try { localStorage.setItem("blockfall_opts", JSON.stringify({ allowHold, showNext, showGhost, sfxVol, musicVol, musicTrack, vibeOn })); } catch (e) {}
}

// ===================== Sound (synthesized) =====================
let audioCtx = null, master = null, noiseBuf = null, limiter = null, thumpBus = null;
// SFX slider 0-100 -> gain (80% = the default loudness)
function sfxLevel() { return 1.5 * Math.pow(sfxVol / 80, 2); }
function ensureAudio() {
  if (!sfxOn && musicVol <= 0) return;
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -14;   // gentler than the default so effects stay punchy
    comp.knee.value = 10;
    comp.ratio.value = 4;
    comp.attack.value = 0.002;
    comp.release.value = 0.15;
    master = audioCtx.createGain();
    master.gain.value = sfxLevel();   // sound-effects volume
    master.connect(comp);
    // final limiter: lets the music be loud without distorting when sound effects play on top
    limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -2;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.001;
    limiter.release.value = 0.12;
    comp.connect(limiter);
    limiter.connect(audioCtx.destination);
    // the hard-drop thump skips the effects compressor so it keeps its punch
    thumpBus = audioCtx.createGain();
    thumpBus.gain.value = sfxLevel();
    // gentle saturation: same thump, but with a little edge so phone speakers can carry it
    const shaper = audioCtx.createWaveShaper();
    const curve = new Float32Array(1024);
    for (let i = 0; i < curve.length; i++) { const x = i / 511.5 - 1; curve[i] = Math.tanh(3 * x) / Math.tanh(3); }
    shaper.curve = curve;
    shaper.oversample = "4x";
    const bassBoost = audioCtx.createBiquadFilter();
    bassBoost.type = "lowshelf";
    bassBoost.frequency.value = 160;
    bassBoost.gain.value = 7;
    thumpBus.connect(bassBoost);
    bassBoost.connect(shaper);
    shaper.connect(limiter);
    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
}
function tone(freq, dur, o = {}) {
  if (!sfxOn || !audioCtx) return;
  const t = audioCtx.currentTime + (o.delay || 0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(freq, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  const v = o.vol || 0.2;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = osc;
  if (o.lp) {
    const f = audioCtx.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = o.lp;
    osc.connect(f); node = f;
  }
  node.connect(g); g.connect(o.bus || master);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function noise(dur, o = {}) {
  if (!sfxOn || !audioCtx) return;
  const t = audioCtx.currentTime + (o.delay || 0);

const DRIVE = [
  { bass: 45, chord: [57, 60, 64] },

  const bar = Math.floor(step / 16) % 8, s = step % 16;
  const ch = DRIVE[bar % 4];
  const busy = bar >= 4; // second half of the loop gets the lead arpeggio
  if (s % 4 === 0) mKick(t);
  if (s === 4 || s === 12) mNoise(t, 0.14, "bandpass", 1800, 0.22);
  if (s % 4 === 2) mNoise(t, 0.05, "highpass", 7000, 0.1);
  else if (busy && s % 2 === 1) mNoise(t, 0.03, "highpass", 8000, 0.04);
  if (s % 2 === 0) mVoice(mtof(ch.bass + (s % 4 === 2 ? 12 : 0)), t, sd * 1.8, "sawtooth", 0.16, 650);
  if (s === 0) ch.chord.forEach(m => mVoice(mtof(m), t, sd * 16, "triangle", 0.035, 1600, 0.3));
  if (busy) {
    const notes = [...ch.chord, ch.chord[0] + 12];
    const m = notes[[0, 1, 2, 3, 2, 1, 2, 3][s % 8]] + 12;
    mVoice(mtof(m), t, sd * 0.9, "square", 0.03, 2800);
  } else if (s === 0 || s === 6 || s === 10) {

// ---- Track 2: NIGHT CIRCUIT (fast E minor drive: Em - C - D - Bm) ----

  const bar = Math.floor(step / 16) % 8, s = step % 16;
  const ch = CIRCUIT[bar % 4];
  const lead = bar >= 4;

  if (s % 4 === 0) mKick(t);
  if (s % 4 === 2) mNoise(t, 0.09, "highpass", 6500, 0.12);
  if (s === 4 || s === 12) mNoise(t, 0.16, "bandpass", 2200, 0.2);

      mVoice(mtof(n), t + sd * 3, sd * 1.4, "square", 0.014, 2400);

// ---- Track 3: STARFALL (dreamy half-time: Fmaj7 - Em7 - Dm7 - Cmaj7) ----
const STAR = [
  { bass: 41, chord: [53, 57, 60, 64] },
  { bass: 40, chord: [52, 55, 59, 62] },
  { bass: 38, chord: [50, 53, 57, 60] },
  { bass: 36, chord: [48, 52, 55, 59] },

  const bar = Math.floor(step / 16) % 8, s = step % 16;
  const ch = STAR[bar % 4];
  const sparkle = bar >= 4;
  // laid-back half-time beat with a soft shaker
  if (s === 0 || s === 10) mKick(t);
  if (s === 8) mNoise(t, 0.22, "bandpass", 1500, 0.16);
  if (s % 2 === 1) mNoise(t, 0.03, "bandpass", 6000, 0.03);

// ===================== Block sprites =====================
const spriteCache = new Map();
function shade(hex, amt) {
  let n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));

}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);

}
// Returns { img, pad } : a glowing, beveled block drawn once and reused
function blockSprite(color, size, glowOn = true) {
  const key = color + "|" + size + "|" + glowOn + "|" + DPR;
  let s = spriteCache.get(key);
  if (s) return s;
  const pad = Math.ceil(size * 0.4);
  const full = size + pad * 2;
  const c = document.createElement("canvas");
  c.width = c.height = Math.ceil(full * DPR);
  const x = c.getContext("2d");
  x.scale(DPR, DPR);
  const inset = Math.max(1, size * 0.06);
  const bx = pad + inset, by = pad + inset, bs = size - inset * 2, r = 0; // square blocks

  if (glowOn) {
    x.shadowColor = color;
    x.shadowBlur = size * 0.45;
  }
  const grad = x.createLinearGradient(bx, by, bx + bs, by + bs);
  grad.addColorStop(0, shade(color, 0.45));
  grad.addColorStop(0.45, color);
  grad.addColorStop(1, shade(color, -0.45));
  x.fillStyle = grad;
  roundRect(x, bx, by, bs, bs, r);
  x.fill();
  x.shadowBlur = 0;

  // glossy top highlight
  x.save();
  roundRect(x, bx, by, bs, bs, r);
  x.clip();
  const hl = x.createLinearGradient(0, by, 0, by + bs * 0.5);
  hl.addColorStop(0, "rgba(255,255,255,0.55)");
  hl.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = hl;
  x.fillRect(bx, by, bs, bs * 0.5);
  // inner core
  x.fillStyle = "rgba(255,255,255,0.12)";
  roundRect(x, bx + bs * 0.24, by + bs * 0.24, bs * 0.52, bs * 0.52, r * 0.6);
  x.fill();
  x.restore();

  // bright rim
  x.lineWidth = Math.max(1, size * 0.06);
  x.strokeStyle = shade(color, 0.55);
  roundRect(x, bx + x.lineWidth / 2, by + x.lineWidth / 2, bs - x.lineWidth, bs - x.lineWidth, r);
  x.stroke();

  return s;
}

  const s = blockSprite(color, size, glowOn);
  ctx.globalAlpha = alpha;
  ctx.drawImage(s.img, gx - s.pad, gy - s.pad, s.full, s.full);
  ctx.globalAlpha = 1;
}

function fitBoard() {

  const availH = boardWrapEl.clientHeight - 6;
  if (availW < 50 || availH < 100) return;
  CELL = Math.max(10, Math.floor(Math.min(availW / W, availH / H)));
  const cw = CELL * W, ch = CELL * H;
  boardCv.style.width = cw + "px";
  boardCv.style.height = ch + "px";
  boardCv.width = Math.round(cw * DPR);
  boardCv.height = Math.round(ch * DPR);

  sizeMini(holdCv, wingW, mini * 2.6);

}
function sizeMini(cv, w, h) {
  cv.style.width = w + "px";

  for (let x = 1; x < W; x++) { g.beginPath(); g.moveTo(x * CELL + 0.5, 0); g.lineTo(x * CELL + 0.5, H * CELL); g.stroke(); }

// ===================== Game logic =====================
function pullFromBag() {
  if (bag.length === 0) {
    bag = [0, 1, 2, 3, 4, 5, 6];
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  return bag.pop();
}
function ensureQueue() { while (nextQueue.length < 6) nextQueue.push(pullFromBag()); }

  for (const [x, y] of shape) {
    const nx = x + ox, ny = y + oy;
    if (nx < 0 || nx >= W || ny >= H) return true;
    if (ny >= 0 && board[ny][nx]) return true;
  }
  return false;
}
function isGrounded() { return collides(SHAPES[curType][rot], px, py + 1); }

function resetLockState() { lockStart = null; lockResets = 0; lowestY = py; pieceId++; }
function noteDescent() { if (py > lowestY) { lowestY = py; lockResets = 0; } }
function onPieceManipulated() {
  noteDescent();
  if (lockStart !== null && lockResets < MAX_LOCK_RESETS) { lockResets++; lockStart = performance.now(); }
}

function spawnNext() {
  ensureQueue();
  curType = nextQueue.shift();
  ensureQueue();
  rot = 0; px = 3; py = 0;
  holdUsed = false;
  lastMoveRotate = false;
  lastFall = performance.now();
  resetLockState();
  if (collides(SHAPES[curType][rot], px, py)) gameOver();
  updateHud();
}

function gameOver() {
  state = "OVER";
  gameOverT0 = performance.now();
  musicStop();
  sfx.over();
  vibe("over");
  shake(10);
  updateHud();
}

function resetGame() {
  board = Array.from({ length: H }, () => Array(W).fill(0));
  bag = []; nextQueue = [];
  holdType = null; holdUsed = false;
  score = 0; lines = 0; level = 1;
  clearing = null; particles = []; trails = []; popups = []; lockFlash = null;
  combo = -1; b2b = false;
  state = "PLAY";
  menuOpen = false;
  spawnNext();
  sfx.start();
  musicStop();
  musicStep = 0;
  musicStart();
  updateHud();
}

function addScore(pts) {
  score += pts;
  if (score > bestScore) {
    bestScore = score;
    try { localStorage.setItem("blockfall_best", String(bestScore)); } catch (e) {}
  }
}

// T-spin: last move was a rotation and 3 of the 4 corners around the T's centre are blocked
function isTSpin() {
  if (curType !== 2 || !lastMoveRotate) return false;
  const cx = px + 1, cy = py + 1;
  let n = 0;
  for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const x = cx + dx, y = cy + dy;
    if (x < 0 || x >= W || y >= H || (y >= 0 && board[y][x])) n++;
  }
  return n >= 3;
}

function lockPiece() {
  const tspin = isTSpin();
  const cells = SHAPES[curType][rot].map(([x, y]) => [px + x, py + y]);
  for (const [x, y] of cells) if (y >= 0) board[y][x] = curType + 1;
  lockFlash = { cells, t0: performance.now() };
  pieceId++; // cancels any gesture still tied to this piece

  const full = [];
  for (let y = 0; y < H; y++) if (board[y].every(c => c)) full.push(y);
  const n = full.length;

  // ---- scoring ----
  let label = "", pts = 0;
  const tags = [];
  if (tspin) label = "T-SPIN" + (n ? " " + ["", "SINGLE", "DOUBLE", "TRIPLE"][n] : "");
  else if (n) label = ["", "SINGLE", "DOUBLE", "TRIPLE", "QUAD!"][n];
  if (tspin || n) pts = (tspin ? [400, 800, 1200, 1600][n] : [0, 100, 300, 500, 800][n]) * level;

  let wasB2B = false, allClear = false;
  if (n) {
    const difficult = n === 4 || tspin;
    if (difficult && b2b) { pts = Math.round(pts * 1.5); tags.push("BACK-TO-BACK"); wasB2B = true; }
    b2b = difficult;
    combo++;
    if (combo > 0) { pts += 50 * combo * level; tags.push("COMBO x" + combo); }
    allClear = board.every((row, y) => full.includes(y) || row.every(c => !c));
  } else {
    combo = -1;
  }
  if (pts) addScore(pts);

  if (n) {
    const oldLevel = level;
    lines += n;
    level = 1 + Math.floor(lines / 10);
    clearing = { rows: full, t0: performance.now() };

    sfx.clear(n);
    if (tspin) sfx.tspin();
    if (combo > 0) sfx.combo(combo);
    if (wasB2B) sfx.b2b();
    vibe(n === 4 || tspin ? "big" : "clear");
    shake(n === 4 || tspin ? 9 : 3 + n);

    for (const y of full) {
      for (let x = 0; x < W; x++) {
        burst((x + 0.5) * CELL, (y + 0.5) * CELL, COLORS[board[y][x] - 1], n === 4 ? 5 : 3, CELL * 9, CELL * 3);
      }
    }
    popup(label, "+" + pts, n === 4 ? "#ffe53b" : tspin ? "#c04bff" : COLORS[curType], tags, "clear");

    if (allClear) {
      const bonus = [0, 800, 1200, 1800, 2000][n] * level;
      addScore(bonus);
      setTimeout(() => { popup("ALL CLEAR", "+" + bonus, "#2cf6ff"); sfx.allClear(); vibe("big"); }, 250);
    }
    if (level > oldLevel) {
      setTimeout(() => { popup("LEVEL " + level, "SPEED UP", "#2cf6ff"); sfx.levelUp(); vibe("medium"); }, 450);
    }
    bumpScore();
    updateHud();
  } else {
    if (tspin) { popup(label, "+" + pts, "#c04bff", [], "clear"); sfx.tspin(); vibe("medium"); bumpScore(); }
    sfx.lock();
    spawnNext();
  }
}

function finishClear() {
  const rows = new Set(clearing.rows);
  board = board.filter((_, y) => !rows.has(y));
  while (board.length < H) board.unshift(Array(W).fill(0));
  clearing = null;
  spawnNext();
}

function canAct() { return state === "PLAY" && !clearing; }

function triggerHold() {
  if (!canAct() || !allowHold || holdUsed) return;
  if (holdType === null) {
    holdType = curType;
    spawnNext();
  } else {
    if (collides(SHAPES[holdType][0], 3, 0)) { sfx.blocked(); return; }
    [curType, holdType] = [holdType, curType];
    rot = 0; px = 3; py = 0;
    lastFall = performance.now();
    resetLockState();
  }
  holdUsed = true;
  sfx.hold();
  updateHud();
}

function moveHoriz(dir) {
  if (!canAct()) return false;
  if (!collides(SHAPES[curType][rot], px + dir, py)) {
    px += dir;
    lastMoveRotate = false;
    onPieceManipulated();
    sfx.move();
    return true;
  }
  return false;
}

function rotatePiece() {
  if (!canAct()) return;
  const nRot = (rot + 1) % SHAPES[curType].length;
  for (const [kx, ky] of KICKS) {
    if (!collides(SHAPES[curType][nRot], px + kx, py + ky)) {
      rot = nRot; px += kx; py += ky;
      lastMoveRotate = true;
      onPieceManipulated();
      sfx.rotate();
      return;
    }
  }
}

// A soft drop's sound waits a moment: if the drag turns into a hard-drop flick,
// it's dropped so only the slam is heard.
let softSfxTimer = null;
function softSfx() {
  if (softSfxTimer) return;
  softSfxTimer = setTimeout(() => { softSfxTimer = null; sfx.soft(); }, 110);
}
function cancelSoftSfx() { clearTimeout(softSfxTimer); softSfxTimer = null; }

function softDrop() {
  if (!canAct()) return false;
  if (!collides(SHAPES[curType][rot], px, py + 1)) {
    py++;
    lastMoveRotate = false;
    noteDescent();
    addScore(1);
    lastFall = performance.now();
    softSfx();
    updateHud();
    return true;
  }
  return false;
}

function hardDrop() {
  if (!canAct()) return;
  const startY = py;
  while (!collides(SHAPES[curType][rot], px, py + 1)) py++;
  const dist = py - startY;
  if (dist > 0) lastMoveRotate = false;
  addScore(dist * 2);
  cancelSoftSfx();
  vibe("heavy");

  // Slam effects: light trail per column, sparks at impact, board shake
  const color = COLORS[curType];
  const cols = new Map();
  for (const [x, y] of SHAPES[curType][rot]) {
    const cx = px + x;
    const c = cols.get(cx);
    cols.set(cx, c ? { top: Math.min(c.top, y), bot: Math.max(c.bot, y) } : { top: y, bot: y });
  }
  for (const [cx, c] of cols) {
    trails.push({ x: cx, y0: startY + c.top, y1: py + c.top, color, t0: performance.now() });
    burst((cx + 0.5) * CELL, (py + c.bot + 1) * CELL, color, 6, CELL * 7, CELL * 4);
  }
  shake(Math.min(9, 3 + dist * 0.4));
  sfx.hard();
  lockPiece();
}

function getGhostY() {
  let gy = py;
  while (!collides(SHAPES[curType][rot], px, gy + 1)) gy++;
  return gy;
}

// ===================== HUD =====================
function updateHud() {
  scoreEl.textContent = score;
  bestEl.textContent = bestScore;
  linesEl.textContent = lines;
  levelEl.textContent = level;

  if (state === "PAUSE") menuOpen = true;
  if (state === "PLAY") menuOpen = false;

  if (state === "OVER") {
    overlayEl.classList.remove("hidden");
    overlayEl.style.transitionDelay = "0.7s";
    ovTitleEl.textContent = "GAME OVER";
    ovScoreEl.textContent = "SCORE " + score;
    ovSubEl.textContent = "TAP TO RETRY";
  } else if (state === "TITLE") {
    overlayEl.classList.remove("hidden");
    overlayEl.style.transitionDelay = "0s";
    ovTitleEl.textContent = "BLOCKFALL";
    ovScoreEl.textContent = bestScore ? "BEST " + bestScore : "";
    ovSubEl.textContent = "TAP TO START";
  } else {
    overlayEl.style.transitionDelay = "0s";
    overlayEl.classList.add("hidden");
  }

  menuEl.classList.toggle("hidden", !menuOpen);
  if (state === "PAUSE") { menuTitleEl.textContent = "PAUSED"; btnStart.textContent = "RESUME"; }
  else if (state === "OVER") { menuTitleEl.textContent = "GAME OVER"; btnStart.textContent = "RETRY"; }
  else { menuTitleEl.textContent = "OPTIONS"; btnStart.textContent = "START"; }
  btnReset.style.display = state === "PAUSE" ? "" : "none";
  syncOptionButtons();

  holdBoxEl.classList.toggle("locked", holdUsed || !allowHold);
  drawSideBoxes();
}

function syncOptionButtons() {
  const set = (id, on, label) => {
    const b = $(id);
    b.textContent = label + ": " + (on ? "ON" : "OFF");
    b.classList.toggle("off", !on);
  };
  set("btn-hold", allowHold, "HOLD");
  set("btn-next", showNext, "NEXT");
  set("btn-ghost", showGhost, "GHOST");
  const ss = $("sfx-vol");
  if (Number(ss.value) !== sfxVol) ss.value = sfxVol;
  ss.style.setProperty("--fill", sfxVol + "%");
  $("sfx-vol-val").textContent = sfxVol ? sfxVol + "%" : "OFF";
  const vs = $("music-vol");
  if (Number(vs.value) !== musicVol) vs.value = musicVol;
  vs.style.setProperty("--fill", musicVol + "%");
  $("music-vol-val").textContent = musicVol ? musicVol + "%" : "OFF";
  $("track-name").textContent = TRACKS[musicTrack].name;
  document.querySelectorAll(".track-opt").forEach((b, i) => b.classList.toggle("sel", i === musicTrack));
  set("btn-vibe", vibeOn, "VIBRATE");
}

function drawMini(ctx, cv, type, cx, cy, mini) {
  const shape = SHAPES[type][0];
  let minX = 4, maxX = 0, minY = 4, maxY = 0;
  for (const [x, y] of shape) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  const w = (maxX - minX + 1) * mini, h = (maxY - minY + 1) * mini;
  for (const [x, y] of shape) {
    drawBlock(ctx, cx - w / 2 + (x - minX) * mini, cy - h / 2 + (y - minY) * mini, mini, COLORS[type], 1, true);
  }
}
function drawSideBoxes() {
  const mini = Math.max(7, Math.floor((holdCv.width / DPR - 8) / 4.2));
  for (const [ctx, cv] of [[holdCtx, holdCv], [nextCtx, nextCv]]) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  const hw = holdCv.width / DPR, hh = holdCv.height / DPR;
  if (allowHold && holdType !== null) drawMini(holdCtx, holdCv, holdType, hw / 2, hh / 2, mini);
  else drawLabel(holdCtx, hw, hh, allowHold ? "—" : "OFF");

  const nw = nextCv.width / DPR, nh = nextCv.height / DPR;
  if (showNext && nextQueue.length) {
    const slot = nh / 5;
    nextQueue.slice(0, 5).forEach((t, i) => drawMini(nextCtx, nextCv, t, nw / 2, slot * (i + 0.5), i === 0 ? mini : mini * 0.85));
  } else drawLabel(nextCtx, nw, nh, showNext ? "" : "OFF");
}
function drawLabel(ctx, w, h, text) {
  ctx.fillStyle = "#8e8ac8";
  ctx.font = "800 11px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, w / 2, h / 2);
}

// ===================== Render =====================
let lastFrame = performance.now();
function render(now) {
  const dt = Math.min(50, now - lastFrame);
  lastFrame = now;
  const ctx = boardCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, boardCv.width, boardCv.height);
  if (gridCanvas) ctx.drawImage(gridCanvas, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Game over: stack turns grey from the bottom up
  const greyRows = state === "OVER" ? Math.min(H, Math.floor((now - gameOverT0) / 30)) : 0;

  // Locked cells
  const clearRows = clearing ? new Set(clearing.rows) : null;
  const cp = clearing ? (now - clearing.t0) / CLEAR_MS : 0;
  for (let y = 0; y < H; y++) {
    if (clearRows && clearRows.has(y) && cp >= 0.35) continue;
    for (let x = 0; x < W; x++) {
      const v = board[y][x];
      if (!v) continue;
      const grey = greyRows && y >= H - greyRows;
      drawBlock(ctx, x * CELL, y * CELL, CELL, grey ? GRAY : COLORS[v - 1], 1, !grey);
    }
  }

  // Line clear animation: flash white, then the row collapses into a bright line
  if (clearing) {
    for (const y of clearing.rows) {
      if (cp < 0.35) {
        ctx.fillStyle = `rgba(255,255,255,${0.85 * (cp / 0.35)})`;
        ctx.fillRect(0, y * CELL, W * CELL, CELL);
      } else {
        const q = Math.min(1, (cp - 0.35) / 0.65);
        const h = CELL * (1 - q);
        ctx.save();
        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = CELL * 0.8;
        ctx.fillStyle = `rgba(255,255,255,${1 - q})`;
        ctx.fillRect(W * CELL * q * 0.5, y * CELL + (CELL - h) / 2, W * CELL * (1 - q), h);
        ctx.restore();
      }
    }
  }

  const showPiece = (state === "PLAY" || state === "PAUSE") && !clearing;

  // Ghost
  if (showPiece && showGhost) {
    const gy = getGhostY();
    const color = COLORS[curType];
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = Math.max(1.5, CELL * 0.07);
    ctx.shadowColor = color;
    ctx.shadowBlur = CELL * 0.3;
    for (const [x, y] of SHAPES[curType][rot]) {
      const gx = (px + x) * CELL, gyy = (gy + y) * CELL;
      if (gy + y < 0) continue;
      ctx.fillStyle = "rgba(255,255,255,0.04)";
      roundRect(ctx, gx + CELL * 0.08, gyy + CELL * 0.08, CELL * 0.84, CELL * 0.84, 0);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  // Hard-drop light trails
  trails = trails.filter(t => now - t.t0 < 260);
  for (const t of trails) {
    const k = (now - t.t0) / 260;
    const top = t.y0 * CELL, bot = (t.y1 + 1) * CELL;
    const g = ctx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(1, t.color);
    ctx.globalAlpha = 0.55 * (1 - k);
    ctx.fillStyle = g;
    const w = CELL * (0.75 - 0.35 * k);
    ctx.fillRect((t.x + 0.5) * CELL - w / 2, top, w, bot - top);
    ctx.globalAlpha = 1;
  }

  // Active piece (dims slightly while the lock timer runs)
  if (showPiece) {
    let a = 1;
    if (lockStart !== null) a = 1 - 0.4 * Math.min(1, (now - lockStart) / LOCK_DELAY);
    for (const [x, y] of SHAPES[curType][rot]) {
      if (py + y < 0) continue;
      drawBlock(ctx, (px + x) * CELL, (py + y) * CELL, CELL, COLORS[curType], a, true);
    }
  }

  // Lock flash
  if (lockFlash) {
    const k = (now - lockFlash.t0) / 170;
    if (k >= 1) lockFlash = null;
    else {
      ctx.fillStyle = `rgba(255,255,255,${0.6 * (1 - k)})`;
      for (const [x, y] of lockFlash.cells) {
        if (y < 0) continue;
        roundRect(ctx, x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2, 0);
        ctx.fill();
      }
    }
  }

  // Particles
  const dts = dt / 1000;
  particles = particles.filter(p => (p.life += dt) < p.max);
  for (const p of particles) {
    p.vy += CELL * 28 * dts;
    p.x += p.vx * dts;
    p.y += p.vy * dts;
    const k = 1 - p.life / p.max;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // Popups (SINGLE / DOUBLE / LEVEL UP ...)
  popups = popups.filter(p => now - p.t0 < 1100);
  for (const p of popups) {
    const k = (now - p.t0) / 1100;
    const scale = k < 0.15 ? 0.6 + (k / 0.15) * 0.5 : 1.1 - Math.min(0.1, (k - 0.15));
    const y = H * CELL * (0.38 + 0.16 * (p.slot % 3)) - k * CELL * 2.2;
    ctx.save();
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.translate(W * CELL / 2, y);
    ctx.scale(scale, scale);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `900 ${Math.round(CELL * 1.2)}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = CELL * 0.7;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(p.text, 0, 0);
    ctx.shadowBlur = CELL * 0.4;
    ctx.fillStyle = p.color;
    ctx.font = `800 ${Math.round(CELL * 0.62)}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.fillText(p.sub, 0, CELL * 1.0);
    if (p.tags && p.tags.length) {
      ctx.font = `900 ${Math.round(CELL * 0.55)}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#ff3fd8";
      p.tags.forEach((t, i) => ctx.fillText(t, 0, -CELL * (0.95 + i * 0.68)));
    }
    ctx.restore();
  }

  // Board shake (springy bump downward)
  const sk = (now - shakeT0) / 220;
  if (sk < 1) {
    const off = shakeAmp * Math.pow(1 - sk, 2) * Math.cos(sk * Math.PI * 3);
    boardFrameEl.style.transform = `translateY(${off.toFixed(2)}px)`;
  } else if (boardFrameEl.style.transform) {
    boardFrameEl.style.transform = "";
  }
}

// ===================== Main loop =====================
function loop(now) {
  if (state === "PLAY") {
    if (clearing) {
      if (now - clearing.t0 >= CLEAR_MS) finishClear();
    } else {
      const speed = Math.max(80, 550 - (level - 1) * 48);
      if (!isGrounded()) {
        lockStart = null;
        if (now - lastFall >= speed) {
          py++;
          noteDescent();
          lastFall = now;
        }
      } else {
        if (lockStart === null) lockStart = now;
        if (now - lockStart >= LOCK_DELAY || lockResets >= MAX_LOCK_RESETS) {
          lockPiece();
          lastFall = now;
        }
      }
    }
  }
  render(now);
  requestAnimationFrame(loop);
}

// ===================== Pause / menu =====================
function togglePlayPause() {
  ensureAudio();
  if (state === "PLAY") {
    state = "PAUSE";
    pausedAt = performance.now();
    musicStop();
    sfx.pause();
    updateHud();
  } else if (state === "PAUSE") {
    state = "PLAY";
    const now = performance.now();
    const pausedFor = now - pausedAt;
    lastFall = now;
    if (lockStart !== null) lockStart = now;
    if (clearing) clearing.t0 += pausedFor;
    saveOpts();
    musicStart();
    updateHud();
  } else {
    menuOpen = false;
    saveOpts();
    resetGame();
  }
}
function onPauseButton() {
  ensureAudio();
  if (state === "PLAY" || state === "PAUSE") togglePlayPause();
  else { menuOpen = !menuOpen; updateHud(); }
}

// ===================== Keyboard =====================
window.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  ensureAudio();
  if (e.key === "Escape" || e.key === "p" || e.key === "P") { onPauseButton(); return; }
  if (state !== "PLAY") {
    if (e.key === " " || e.key === "Enter") togglePlayPause();
    return;
  }
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") moveHoriz(-1);
  else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") moveHoriz(1);
  else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") rotatePiece();
  else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") softDrop();
  else if (e.key === " ") hardDrop();
  else if (e.key === "c" || e.key === "C" || e.key === "Shift") triggerHold();
});

// ===================== Touch gestures (whole screen) =====================
let tStartX = 0, tStartY = 0, tStartTime = 0;
let lastRefX = 0, lastRefY = 0;
let prevMoveX = 0, prevMoveY = 0;
let touchPieceId = -1;
let gestureMode = null; // null | "HORIZONTAL" | "VERTICAL"
let verticalStartY = 0, verticalStartTime = 0;
let pointerHistory = [];
let groundRefX = null; // finger x when a dragged-down piece touched the bottom
let softAcc = 0;        // soft-drop progress in rows (grows faster the faster you drag)
let softRefX = 0;       // finger x reference for sideways moves during a soft drop
// Drops go by finger speed (CSS px per ms), not by how far the thumb travels
const HARD_VY = 1.0;          // a quick downward flick this fast slams the piece mid-swipe
const HARD_MIN_DY = 18;       // ...as long as it moved at least this far in the last moment
const HARD_RELEASE_VY = 0.6;  // a flick that ends with this speed on release also slams
const SOFT_SIDE_MAX_VY = 0.6; // above this downward speed (a flick) sideways drift is ignored

// Thumb travel per column: based on the phone's width, not the board's, so a bigger
// board doesn't change how far you swipe (same feel as before: ~28px on a 412px phone).
const SWIPE_CELL = 0.068;
function getCellWidth() { return Math.max(13, Math.min(window.innerWidth, 520) * SWIPE_CELL); }

const touchSurfaceEl = $("app");
const NO_GESTURE = "button, #hold-box, #next-box";

touchSurfaceEl.addEventListener("pointerdown", e => {
  if (!e.isPrimary || e.target.closest(NO_GESTURE)) return;
  ensureAudio();
  if (state !== "PLAY") {
    if (!menuOpen && !(state === "OVER" && performance.now() - gameOverT0 < 700)) togglePlayPause();
    return;
  }
  const now = performance.now();
  tStartX = lastRefX = prevMoveX = e.clientX;
  tStartY = lastRefY = prevMoveY = e.clientY;
  tStartTime = now;
  touchPieceId = pieceId;
  gestureMode = null;
  verticalStartY = e.clientY;
  verticalStartTime = now;
  pointerHistory = [{ x: e.clientX, y: e.clientY, t: now }];
  groundRefX = null;
  softAcc = 0;
  try { touchSurfaceEl.setPointerCapture(e.pointerId); } catch (err) {}
});

touchSurfaceEl.addEventListener("pointermove", e => {
  if (!e.isPrimary || touchPieceId !== pieceId || state !== "PLAY") return;
  const now = performance.now();
  const cw = getCellWidth();
  const totalDx = e.clientX - tStartX;
  const totalDy = e.clientY - tStartY;
  const dist = Math.hypot(totalDx, totalDy);
  const stepDx = e.clientX - prevMoveX;
  const stepDy = e.clientY - prevMoveY;
  prevMoveX = e.clientX;
  prevMoveY = e.clientY;

  pointerHistory.push({ x: e.clientX, y: e.clientY, t: now });
  while (pointerHistory.length > 1 && now - pointerHistory[0].t > 75) pointerHistory.shift();
  const recent = pointerHistory[0];
  const recentDx = e.clientX - recent.x;
  const recentDy = e.clientY - recent.y;
  const recentVy = recentDy / Math.max(1, now - recent.t);

  if (gestureMode === null) {
    if (dist < 10) return;
    if (totalDy > 0 && totalDy >= Math.abs(totalDx) * 0.85) {
      gestureMode = "VERTICAL";
      softRefX = e.clientX;
      lastRefY = tStartY; verticalStartY = tStartY; verticalStartTime = tStartTime;
    } else if (Math.abs(totalDx) > Math.abs(totalDy) * 1.15) {
      gestureMode = "HORIZONTAL";
      lastRefX = tStartX;
    } else return;
  }

  if (gestureMode === "HORIZONTAL") {
    if (stepDy > 0 && stepDy >= Math.abs(stepDx) * 0.75) lastRefX += stepDx;
    if (recentDy > 12 && recentDy >= Math.abs(recentDx) * 0.9) {
      gestureMode = "VERTICAL";
      softRefX = e.clientX;
      lastRefY = e.clientY; verticalStartY = recent.y; verticalStartTime = recent.t;
    }
  }

  if (gestureMode === "HORIZONTAL") {
    const dx = e.clientX - lastRefX;
    if (Math.abs(dx) >= cw) {
      const steps = Math.trunc(dx / cw);
      const dir = Math.sign(steps);
      for (let i = 0; i < Math.abs(steps); i++) moveHoriz(dir);
      lastRefX += steps * cw;
    }
  } else if (gestureMode === "VERTICAL") {
    // fast downward flick: slam right away, no need to finish the swipe
    if (recentVy >= HARD_VY && recentDy >= HARD_MIN_DY) {
      hardDrop();
      touchPieceId = -1;
      gestureMode = null;
      return;
    }
    // left/right still works while soft dropping (but a flick's sideways drift is ignored)
    if (recentVy < SOFT_SIDE_MAX_VY) {
      const sdx = e.clientX - softRefX;
      if (Math.abs(sdx) >= cw) {
        const steps = Math.trunc(sdx / cw);
        for (let i = 0; i < Math.abs(steps); i++) moveHoriz(Math.sign(steps));
        softRefX += steps * cw;
      }
    } else {
      softRefX = e.clientX;
    }
    // slower drag: soft drop, more rows per pixel the faster the thumb moves
    if (stepDy > 0) {
      softAcc += (stepDy / (cw * 0.75)) * (1 + 2.5 * Math.max(0, recentVy));
      const steps = Math.floor(softAcc);
      for (let i = 0; i < steps; i++) { if (touchPieceId !== pieceId) break; softDrop(); }
      softAcc -= steps;
    } else if (stepDy < 0) {
      softAcc = 0;
    }
  }
});

function finishGesture(e) {
  if (!e.isPrimary) return;
  if (touchPieceId !== pieceId || state !== "PLAY") { touchPieceId = -1; gestureMode = null; return; }
  const now = performance.now();
  const totalDt = Math.max(1, now - tStartTime);
  const totalDist = Math.hypot(e.clientX - tStartX, e.clientY - tStartY);
  if (gestureMode === null && totalDist < 12 && totalDt < 280) rotatePiece();
  else if (gestureMode === "VERTICAL" || gestureMode === null) {
    // speed of the last moment before letting go
    pointerHistory.push({ x: e.clientX, y: e.clientY, t: now });
    while (pointerHistory.length > 1 && now - pointerHistory[0].t > 75) pointerHistory.shift();
    const r0 = pointerHistory[0];
    const rDy = e.clientY - r0.y, rDx = e.clientX - r0.x;
    const rVy = rDy / Math.max(1, now - r0.t);
    if (rVy >= HARD_RELEASE_VY && rDy >= 12 && rDy >= Math.abs(rDx) * 0.85) hardDrop();
  }
  touchPieceId = -1;
  gestureMode = null;
}
touchSurfaceEl.addEventListener("pointerup", finishGesture);
touchSurfaceEl.addEventListener("pointercancel", () => { touchPieceId = -1; gestureMode = null; });

// ===================== Buttons =====================
$("btn-pause").addEventListener("click", onPauseButton);
btnStart.addEventListener("click", togglePlayPause);
btnReset.addEventListener("click", () => { ensureAudio(); menuOpen = false; resetGame(); });
holdBoxEl.addEventListener("click", () => { ensureAudio(); triggerHold(); });
$("next-box").addEventListener("click", () => { showNext = !showNext; saveOpts(); updateHud(); });
$("btn-hold").addEventListener("click", () => { allowHold = !allowHold; updateHud(); });
$("btn-next").addEventListener("click", () => { showNext = !showNext; updateHud(); });
$("btn-ghost").addEventListener("click", () => { showGhost = !showGhost; updateHud(); });
let sfxPreviewAt = 0;
$("sfx-vol").addEventListener("input", e => {
  sfxVol = Number(e.target.value);
  sfxOn = sfxVol > 0;
  syncOptionButtons();
  if (!sfxOn) return;
  ensureAudio();
  if (master && audioCtx) {
    master.gain.setTargetAtTime(Math.max(0.0001, sfxLevel()), audioCtx.currentTime, 0.02);
    thumpBus.gain.setTargetAtTime(Math.max(0.0001, sfxLevel()), audioCtx.currentTime, 0.02);
  }
  // play a sample sound while dragging (not too often)
  const now = performance.now();
  if (now - sfxPreviewAt > 180) { sfxPreviewAt = now; sfx.rotate(); }
});
$("sfx-vol").addEventListener("change", () => { saveOpts(); if (sfxOn) sfx.lock(); });

let previewTimer = null;
$("music-vol").addEventListener("input", e => {
  musicVol = Number(e.target.value);
  syncOptionButtons();
  if (musicVol <= 0) { musicStop(); return; }
  // preview the music while you drag, then stop again if the game is paused
  musicStart();
  applyMusicVolume();
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => { if (state !== "PLAY") musicStop(); }, 1500);
});
$("music-vol").addEventListener("change", saveOpts);

// Track picker: opens a list, picking one plays a short preview
const trackListEl = $("track-list");
TRACKS.forEach((tr, i) => {
  const b = document.createElement("button");
  b.className = "track-opt";
  b.innerHTML = `<span class="t-dot"></span><span><div class="t-name">${tr.name}</div><div class="t-desc">${tr.desc}</div></span>`;
  b.addEventListener("click", () => {
    musicTrack = i;
    saveOpts();
    syncOptionButtons();
    trackListEl.classList.add("hidden");
    $("btn-track").classList.remove("open");
    musicStop();
    musicStep = 0;
    if (musicVol > 0) {
      setTimeout(() => {
        musicStart();
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => { if (state !== "PLAY") musicStop(); }, 5000);
      }, 160);
    }
  });
  trackListEl.appendChild(b);
});
$("btn-track").addEventListener("click", () => {
  const open = trackListEl.classList.toggle("hidden") === false;
  $("btn-track").classList.toggle("open", open);
});
$("btn-vibe").addEventListener("click", () => {
  vibeOn = !vibeOn;
  if (vibeOn) vibe("medium");
  updateHud();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "PLAY") togglePlayPause();
});

// ===================== Start =====================
board = Array.from({ length: H }, () => Array(W).fill(0));
ensureQueue();
updateHud();
requestAnimationFrame(() => { fitBoard(); requestAnimationFrame(loop); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
