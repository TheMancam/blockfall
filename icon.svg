<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f5c"/>
      <stop offset="1" stop-color="#07051a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <rect x="96"  y="300" width="100" height="100" rx="18" fill="#ff3fd8"/>
    <rect x="206" y="300" width="100" height="100" rx="18" fill="#c04bff"/>
    <rect x="316" y="300" width="100" height="100" rx="18" fill="#2cf6ff"/>
    <rect x="206" y="112" width="100" height="100" rx="18" fill="#2cf6ff" opacity="0.9"/>
  </g>
  <rect x="236" y="212" width="40" height="78" fill="#2cf6ff" opacity="0.35"/>
</svg>
